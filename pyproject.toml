[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "core-i18n"
version = "0.1.0"
description = "Pre-translated UI strings for modern applications"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.packages.find]
include = ["core_i18n*"]

[tool.setuptools.package-data]
core_i18n = ["locale/*/LC_MESSAGES/core-i18n.mo"]
